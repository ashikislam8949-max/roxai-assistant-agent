plugins {
    id "com.android.application"
}

android {
    namespace "com.todob.bot"
    compileSdk 37

    defaultConfig {
        applicationId "com.todob.bot"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main.assets.srcDirs = ["../../web"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
