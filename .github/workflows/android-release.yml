# Release bundle for the ROX AI Android app. No Play upload.
# Signing and Firebase are optional. Missing secrets produce an unsigned AAB
# and a green run. The keystore and google-services.json are never committed.
name: Android release AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-release:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          tools_zip="${RUNNER_TEMP}/commandlinetools.zip"
          curl -fsSL -o "$tools_zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          mkdir -p "${sdk_root}/cmdline-tools"
          unzip -q "$tools_zip" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/tmp/sdk-licenses.log
          set -e
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] && present=$((present + 1))
          [ -n "${STORE_PASSWORD}" ] && present=$((present + 1))
          [ -n "${KEY_PASSWORD}" ] && present=$((present + 1))
          if [ "$present" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD are not set. Building an unsigned AAB. Add those secrets later to sign with key alias upload."
            {
              echo "### Release signing"
              echo "Signing secrets are not set, so this AAB is **unsigned**. The job stays green."
              echo "Add \`ANDROID_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` to produce a signed AAB. The key alias is \`upload\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$present" -ne 3 ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD together, or leave all three empty. The key alias is upload."
            exit 1
          fi
          umask 077
          keystore="${RUNNER_TEMP}/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -alias upload -storepass "$STORE_PASSWORD" >/tmp/keytool-list.txt 2>/tmp/keytool-list.err; then
            echo "::error::The keystore must contain key alias upload, and STORE_PASSWORD must unlock it."
            exit 1
          fi
          echo "KEYSTORE_PATH=${keystore}" >> "$GITHUB_ENV"
          store_delim="STORE_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          key_delim="KEY_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "STORE_PASSWORD<<${store_delim}"
            printf '%s\n' "$STORE_PASSWORD"
            echo "${store_delim}"
            echo "KEY_PASSWORD<<${key_delim}"
            printf '%s\n' "$KEY_PASSWORD"
            echo "${key_delim}"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "### Release signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing with key alias \`upload\`. versionCode is the workflow run number." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          target="android/app/google-services.json"
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON is not set. Reply notifications are left out of this build."
            echo "### Reply notifications" >> "$GITHUB_STEP_SUMMARY"
            echo "\`GOOGLE_SERVICES_JSON\` is not set, so this build has no Firebase config and notifications stay off." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          trimmed=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')
          if printf '%s' "$trimmed" | grep -q '^{'; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$target"
          else
            printf '%s' "$trimmed" | base64 --decode > "$target"
          fi
          if ! head -c 1 "$target" | grep -q '{'; then
            rm -f "$target"
            echo "::error::GOOGLE_SERVICES_JSON must be the raw google-services.json object, or its base64."
            exit 1
          fi
          echo "### Reply notifications" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase config was supplied for this build and was not committed." >> "$GITHUB_STEP_SUMMARY"

      - name: Build release bundle
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify the AAB signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          aab="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$aab"
          jarsigner -verify "$aab" > /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt
          unzip -l "$aab" | grep -Eq 'META-INF/.*\.(SF|RSA|EC|DSA)$'

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: roxai-${{ steps.signing.outputs.configured == 'true' && 'signed' || 'unsigned' }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
